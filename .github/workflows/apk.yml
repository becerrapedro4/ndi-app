name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # El código nativo (puente JNI + libndi.so) no cambia entre versiones de la
      # interfaz. Se toman del APK v1.9.2 publicado, así la compilación no necesita
      # el SDK de NDI para Android, que la licencia no permite versionar.
      - name: Librerías nativas de NDI ya compiladas
        run: |
          curl -fsSL -o /tmp/base.apk \
            "https://github.com/becerrapedro4/ndi-app/releases/download/v1.9.2/NDI-App-1.9.2.apk"
          unzip -o -q /tmp/base.apk 'lib/*' -d /tmp/base
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "/tmp/base/lib/$abi/libndi.so" "/tmp/base/lib/$abi/libndi_app.so" \
               "android/app/src/main/jniLibs/$abi/"
          done

      - name: Compilar APK de release
        run: |
          cd android
          ./gradlew assembleRelease -PprebuiltNdi=true --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: NDI-App-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
