name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # libndi.so es la biblioteca propietaria del SDK y no se puede versionar:
      # se toma del APK v1.9.2 ya publicado. El puente JNI sí se compila en cada
      # compilación contra las cabeceras MIT de ndi-sdk/include, así los cambios
      # en ndi_bridge.cpp llegan al APK.
      - name: Librería NDI del APK base
        run: |
          curl -fsSL -o /tmp/base.apk \
            "https://github.com/becerrapedro4/ndi-app/releases/download/v1.9.2/NDI-App-1.9.2.apk"
          unzip -o -q /tmp/base.apk 'lib/*' -d /tmp/base
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "/tmp/base/lib/$abi/libndi.so" "android/app/src/main/jniLibs/$abi/"
          done

      - name: Compilar el puente JNI de NDI
        run: |
          set -eux
          NDK="$ANDROID_NDK_LATEST_HOME"
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S android/app/src/main/cpp -B "/tmp/ndi-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "/tmp/ndi-$abi" -j"$(nproc)"
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "$(find "/tmp/ndi-$abi" -name libndi_app.so | head -1)" \
               "android/app/src/main/jniLibs/$abi/"
          done

      # libsrt (MPL-2.0) se compila para las dos ABIs sin cifrado (no necesita
      # OpenSSL) y se enlaza con el puente JNI en libsrt_app.so. Con esto el APK
      # trae SRT de verdad, sin tocar la compilación de NDI.
      - name: Compilar libsrt y el puente JNI
        run: |
          set -eux
          curl -fsSL -o /tmp/srt.tar.gz \
            "https://github.com/Haivision/srt/archive/refs/tags/v1.5.3.tar.gz"
          mkdir -p /tmp/srt-src
          tar -xzf /tmp/srt.tar.gz -C /tmp/srt-src --strip-components=1
          NDK="$ANDROID_NDK_LATEST_HOME"
          for abi in arm64-v8a armeabi-v7a; do
            prefix="/tmp/srt-$abi"
            cmake -S /tmp/srt-src -B "/tmp/srt-build-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DENABLE_ENCRYPTION=OFF -DENABLE_APPS=OFF -DENABLE_SHARED=OFF \
              -DENABLE_STATIC=ON -DENABLE_BONDING=OFF \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DUSE_OPENSSL_PC=OFF
            cmake --build "/tmp/srt-build-$abi" -j"$(nproc)"
            cmake --install "/tmp/srt-build-$abi"
            cmake -S tools/srtbuild -B "/tmp/jni-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$abi" -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release -DSRT_ROOT="$prefix"
            cmake --build "/tmp/jni-$abi" -j"$(nproc)"
            mkdir -p "android/app/src/main/jniLibs/$abi"
            cp "/tmp/jni-$abi/out/libsrt_app.so" "android/app/src/main/jniLibs/$abi/"
          done

      - name: Compilar APK de release
        run: |
          cd android
          ./gradlew assembleRelease -PprebuiltNdi=true --no-daemon --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: NDI-App-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
